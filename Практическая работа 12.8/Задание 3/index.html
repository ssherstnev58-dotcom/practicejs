<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Промокоды</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="promocode-card">
    <form class="promocode-form">
      <div class="form-row">
        <input type="text" name="promocode" class="promocode-input" placeholder="ПРОМОКОД" required>
        <button type="submit" class="promocode-button">Применить</button>
      </div>
      <p class="promocode-message hidden"></p>
    </form>
  </div>

  <script src="index.js"></script>
</body>
</html>
