<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Оформление банковской карты</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Оформление банковской карты</h1>

    <div class="controls">
      <input type="text" class="card-input" placeholder="Введите текст на карте">

      <select class="color-select">
        <option value="red">Красный</option>
        <option value="blue">Синий</option>
        <option value="green">Зелёный</option>
      </select>
    </div>

    <p class="card"></p>
  </div>

  <script src="index.js"></script>
</body>
</html>
