<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор стоимости доставки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Калькулятор стоимости доставки</h1>

    <form class="delivery-form">
      <div class="form-group">
        <label class="form-label">Название товара:</label>
        <input type="text" class="input-field input-name">
      </div>

      <div class="form-group">
        <label class="form-label">Вес товара (кг):</label>
        <input type="number" step="any" class="input-field input-weight">
      </div>

      <div class="form-group">
        <label class="form-label">Расстояние доставки (км):</label>
        <input type="number" step="any" class="input-field input-distance">
      </div>

      <button type="submit" class="btn-add">Добавить товар</button>
    </form>

    <div class="error-message hidden">Пожалуйста, введите корректные значения для веса и расстояния.</div>

    <table class="product-table">
      <thead>
        <tr>
          <th>Название товара</th>
          <th>Вес (кг)</th>
          <th>Расстояние (км)</th>
          <th>Стоимость доставки</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

  <script src="index.js"></script>
</body>
</html>
