<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Фильмотека</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <form class="film-form">
      <div class="form-group">
        <label class="form-label">Название:</label>
        <input type="text" name="title" class="form-input input-title" required>
      </div>

      <div class="form-group">
        <label class="form-label">Жанр:</label>
        <input type="text" name="genre" class="form-input input-genre" required>
      </div>

      <div class="form-group">
        <label class="form-label">Год:</label>
        <input type="number" name="releaseYear" class="form-input input-year" required>
      </div>

      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" name="isWatched" class="input-watched">
          Успели посмотреть?
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="form-button submit-button">Добавить</button>
        <button type="button" class="form-button cancel-button hidden">Отменить редактирование</button>
      </div>

      <p class="error-message hidden">Пожалуйста, заполните все поля корректно.</p>
    </form>

    <div class="sort-controls">
      <select class="sort-select">
        <option value="releaseYear">Год</option>
        <option value="title">Название</option>
        <option value="genre">Жанр</option>
      </select>
      <button type="button" class="sort-button">Сортировать</button>
    </div>

    <table class="film-table">
      <thead>
        <tr>
          <th>Название</th>
          <th>Жанр</th>
          <th>Год</th>
          <th>Успели посмотреть?</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody class="film-tbody"></tbody>
    </table>
  </div>

  <script src="index.js"></script>
</body>
</html>
